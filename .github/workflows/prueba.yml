name: Prueba de conector

# Ejecuta un módulo del motor sobre una carpeta vacía y sube el resultado a la rama "sondas"
# para revisarlo, sin tocar la rama de datos.

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: "Módulo de Python (por ejemplo motor.autonomicos.boja)"
        required: true
      argumentos:
        description: "Argumentos (se añade --salida automáticamente)"
        required: false
      ejecutor:
        description: "Dónde se ejecuta: github (servidores de GitHub, fuera de España) o espana (servidor propio en España, para las fuentes que no responden a GitHub)"
        type: choice
        options: [github, espana]
        default: github

permissions:
  contents: write

concurrency:
  group: rama-sondas
  cancel-in-progress: false

jobs:
  prueba:
    runs-on: ${{ inputs.ejecutor == 'espana' && fromJSON('["self-hosted", "espana"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Ejecutar
        env:
          MODULO: ${{ inputs.modulo }}
          ARGS: ${{ inputs.argumentos }}
        run: |
          case "$MODULO" in motor.*) ;; *) echo "Módulo no permitido"; exit 1;; esac
          STAMP=$(date -u +%Y%m%dT%H%M%S)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          mkdir -p "prueba/$STAMP"
          set +e
          python -m "$MODULO" $ARGS --salida "prueba/$STAMP" > "prueba/$STAMP/salida.txt" 2>&1
          echo "codigo=$?" >> "prueba/$STAMP/salida.txt"
          tail -n 30 "prueba/$STAMP/salida.txt"
      - name: Anonimizar (la rama sondas es pública)
        run: python -m motor.mantenimiento.anonimizar "prueba/$STAMP"
      - name: Subir a la rama sondas
        run: |
          cd prueba
          git init -q && git config user.name "motor-prueba" && git config user.email "motor-prueba@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin sondas; then git reset -q FETCH_HEAD; fi
          git checkout -q -B sondas
          git add "$STAMP" && git commit -qm "Prueba ${{ inputs.modulo }}" && git push -q origin sondas
      - name: Borrar la copia local (lleva el token de esta ejecución)
        if: always()
        run: rm -rf prueba
