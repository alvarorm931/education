name: Sonda de fuentes

# Descarga unas pocas URLs para estudiar su formato real antes de programar un conector.
# Los resultados van a la rama "sondas", separada de los datos. La rama es pública: antes de subir, los nombres
# de personas y los documentos de identidad se sustituyen por datos inventados (motor.mantenimiento.anonimizar).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espacios"
        required: true

permissions:
  contents: write

# Sin grupo de concurrencia: varias sondas pueden correr a la vez (otras conversaciones también las usan).
# Cada una escribe en su propia carpeta con fecha y hora; si la subida choca, se reintenta sobre lo último.

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: codigo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar el anonimizador
        run: pip install -q -e ./codigo
      - name: Preparar rama sondas
        run: |
          git init -q sondas && cd sondas
          git config user.name "motor-sonda"
          git config user.email "motor-sonda@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads origin sondas >/dev/null; then
            git fetch -q --depth 1 origin sondas && git checkout -q -b sondas FETCH_HEAD
          else
            git checkout -q --orphan sondas
          fi
      - name: Descargar
        env:
          URLS: ${{ inputs.urls }}
        run: |
          cd sondas
          STAMP=$(date -u +%Y%m%dT%H%M%S)
          mkdir -p "$STAMP"
          i=0
          for u in $URLS; do
            i=$((i+1))
            # Formato opcional para APIs que solo aceptan POST: POST:https://host/ruta|campo=valor&campo2=valor2
            URL="$u"; EXTRA=()
            case "$u" in
              POST:*) R="${u#POST:}"; URL="${R%%|*}"; EXTRA=(-X POST --data "${R#*|}") ;;
            esac
            curl -sS -L --max-time 25 --connect-timeout 10 -A "PortalEstudiosOposiciones/0.1 (motor de datos publicos; peticiones moderadas)" \
              "${EXTRA[@]}" -D "$STAMP/$i.cabeceras.txt" -o "$STAMP/$i.cuerpo" -w "%{http_code} %{content_type} %{size_download} %{url_effective}\n" "$URL" \
              > "$STAMP/$i.estado.txt" 2>&1 || true
            echo "$i $u" >> "$STAMP/indice.txt"
            cat "$STAMP/$i.estado.txt"
            sleep 1
          done
          (cd .. && python -m motor.mantenimiento.anonimizar "sondas/$STAMP") || { rm -rf "$STAMP"; echo "::error::no se pudo anonimizar"; exit 1; }
          cp -r "$STAMP" "../$STAMP"
          git add -A && git commit -qm "Sonda $STAMP"
          for intento in 1 2 3 4 5 6; do
            git push -q origin HEAD:sondas && exit 0
            sleep $((intento * 4))
            git fetch -q --depth 1 origin sondas
            git checkout -q --detach FETCH_HEAD
            cp -r "../$STAMP" .
            git add -A && git commit -qm "Sonda $STAMP"
          done
          exit 1
