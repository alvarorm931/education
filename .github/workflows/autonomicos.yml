name: Boletines autonómicos

# Boletines de las comunidades con conector: Andalucía (BOJA), Madrid (BOCM), Castilla y León (BOCYL),
# Comunitat Valenciana (DOGV), Galicia (DOG), Cataluña (DOGC), Aragón (BOA), Extremadura (DOE),
# Illes Balears (BOIB), Región de Murcia (BORM), Canarias (BOC), País Vasco (BOPV), Castilla-La Mancha (DOCM)
# y Melilla (BOME); y provinciales: Barcelona (BOPB), Tarragona (BOPT), Alicante, Valencia, Ciudad Real, Granada, Sevilla y Huesca.
#
# Un trabajo por boletín, en paralelo: cada uno pide a su propia fuente (una petición por segundo como mucho),
# escribe solo en su carpeta de la rama «datos» y su propio índice de originales, así que las subidas no chocan
# (si coinciden en el tiempo, se reintenta tras rebase).
# El repositorio es público: los ejecutores estándar de GitHub no consumen minutos de pago
# (https://docs.github.com/en/billing/concepts/product-billing/github-actions). Límite: 6 horas por trabajo.
# Primero lo del día, luego la carga histórica pendiente y después los textos; todo es reanudable.

on:
  schedule:
    - cron: "17 7 * * *"   # 08:17 / 09:17 en Madrid según horario
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos máximos por boletín para la carga histórica y, aparte, para los textos"
        default: "60"
      conectores:
        description: "Conectores, separados por espacios"
        default: "boja bocm bocyl dogv dog dogc boa doe boib borm boc bopv docm bome bopb bopalicante bopvalencia bopt bopciudadreal bopgranada bopsevilla bophuesca"

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar y probar
        run: |
          pip install -e ".[dev]"
          python -m pytest -q
      - id: lista
        env:
          CONECTORES: ${{ inputs.conectores || 'boja bocm bocyl dogv dog dogc boa doe boib borm boc bopv docm bome bopb bopalicante bopvalencia bopt bopciudadreal bopgranada bopsevilla bophuesca' }}
        run: python -c "import json, os; print('lista=' + json.dumps(os.environ['CONECTORES'].split()))" >> "$GITHUB_OUTPUT"

  boletin:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # El plan gratuito admite 20 trabajos a la vez en todo el repositorio (también los de másters):
      # como mucho 10 boletines a la vez para dejar sitio a los demás flujos.
      max-parallel: 10
      matrix:
        conector: ${{ fromJSON(needs.preparar.outputs.lista) }}
    concurrency:
      group: autonomico-${{ matrix.conector }}
      cancel-in-progress: false
    env:
      MINUTOS: ${{ inputs.minutos || '60' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install -e .

      - name: Preparar rama de datos
        run: |
          git config user.name "motor-datos"
          git config user.email "motor-datos@users.noreply.github.com"
          git fetch --depth 1 origin datos
          git worktree add -B datos salida origin/datos
          cat > guardar.sh <<'EOF'
          #!/usr/bin/env bash
          # Guarda y sube lo que haya cambiado. Si la subida choca con otra, reintenta tras rebase.
          cd salida
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "$1"
          for i in 1 2 3 4 5 6 7 8; do
            git push -q origin datos && exit 0
            sleep $(( i * 4 + RANDOM % 7 ))
            git fetch -q --depth 100 origin datos && git rebase -q origin/datos || { git rebase --abort; echo "::warning::$1: la subida choca con otra"; exit 1; }
          done
          echo "::warning::$1: no se pudo subir"
          exit 1
          EOF
          chmod +x guardar.sh

      - name: Conector
        run: bash infra/autonomicos.sh salida "$MINUTOS" "${{ matrix.conector }}" ./guardar.sh

      - name: Resumen legible por la API
        if: always()
        env:
          B: ${{ matrix.conector }}
        run: |
          python - <<'EOF'
          import os, pathlib
          b = os.environ["B"]
          d = pathlib.Path("salida/datos/autonomicos") / b
          if not d.exists():
              d = pathlib.Path("salida/datos/provinciales") / b
          informes = sum(len(list((d / c).rglob("*.json"))) for c in ("dias", "meses", "boletines"))
          empleo = sum(1 for f in (d / "oposiciones").rglob("*.jsonl") for l in f.open(encoding="utf-8") if l.strip())
          textos = len(list((d / "textos").rglob("*.json")))
          linea = f"{b}: {informes} días o boletines con informe, {empleo} anuncios de empleo, {textos} textos"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              s.write(linea + "\n")
          print(f"::notice title=Resumen {b}::{linea}")
          EOF
