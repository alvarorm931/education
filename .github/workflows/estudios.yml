name: Estudios por tramos

# Ejecuta un módulo de motor/estudios en varios tramos (matriz) y junta los resultados en un solo commit
# en la rama "sondas". Evita que las pruebas encoladas se cancelen entre sí y permite tramos de hasta 55
# minutos. Con la misma fuente (p. ej. el RUCT) usar paralelo=1 para no pasar de una petición por segundo.

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: "Módulo (por ejemplo motor.estudios.centros_ruct)"
        required: true
      tramos:
        description: 'Lista JSON de argumentos, uno por tramo: ["--desde 0 --hasta 37", "--desde 37 --hasta 73"]'
        required: true
      paralelo:
        description: "Tramos a la vez (1 si todos van a la misma fuente)"
        default: "1"
      entrada:
        description: "Rutas de la rama sondas que necesita el módulo, separadas por espacios (quedan en ./entrada/)"
        required: false
        default: ""
      por_tramo:
        description: "si: cada tramo sube sus resultados a sondas al terminar (para usarlos sin esperar al resto)"
        type: choice
        options: ["no", "si"]
        default: "no"
      ejecutor:
        description: "Dónde se ejecuta: github (servidores de GitHub) o espana (servidor propio en España; los tramos van en fila)"
        type: choice
        options: [github, espana]
        default: github

# id-token: solo para pedir por OIDC credenciales temporales del almacén privado (sin claves guardadas). El rol
# de AWS solo lo pueden asumir flujos de la rama main y no puede borrar ni sobrescribir.
permissions:
  contents: write
  id-token: write

jobs:
  tramo:
    # Solo workflow_dispatch: el servidor propio nunca ejecuta código de un pull request (repositorio público)
    runs-on: ${{ inputs.ejecutor == 'espana' && fromJSON('["self-hosted", "espana"]') || 'ubuntu-latest' }}
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.paralelo) }}
      matrix:
        args: ${{ fromJSON(inputs.tramos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e ".[estudios,almacen]"
      - name: Chromium para las páginas que solo se pintan con JavaScript (extracción con --navegador)
        if: contains(matrix.args, '--navegador')
        run: pip install -q "playwright>=1.45" && python -m playwright install --with-deps chromium
      - name: Traer entradas de la rama sondas
        if: inputs.entrada != ''
        env:
          RUTAS: ${{ inputs.entrada }}
        run: |
          git fetch -q --depth 1 --filter=blob:none origin sondas
          mkdir -p entrada
          for r in $RUTAS; do
            git archive FETCH_HEAD "$r" | tar -x -C entrada
          done
          find entrada -maxdepth 6 -type d | head -20
      - name: Ejecutar
        env:
          MODULO: ${{ inputs.modulo }}
          ARGS: ${{ matrix.args }}
          # La clave de la API solo llega a los módulos que llaman a Claude (extracción, clasificación y tarifas).
          ANTHROPIC_API_KEY: ${{ contains(fromJSON('["motor.estudios.extraer", "motor.estudios.clasificar", "motor.estudios.tarifas"]'), inputs.modulo) && secrets.ANTHROPIC_API_KEY || '' }}
          # Los módulos que leen webs de centros guardan el original de cada página (y la extracción, lo enviado a
          # la API y las citas) en el almacén privado de S3, con escritura única y credenciales OIDC que se renuevan
          # solas (motor/credenciales_aws.py). Nada de eso llega a la rama pública.
          MOTOR_ORIGINALES: ${{ contains(fromJSON('["motor.estudios.extraer", "motor.estudios.clasificar", "motor.estudios.rastreador", "motor.estudios.tarifas", "motor.estudios.ruct", "motor.estudios.qedu_masters"]'), inputs.modulo) && 's3' || 'huella' }}
        run: |
          case "$MODULO" in motor.estudios.*) ;; *) echo "Módulo no permitido"; exit 1;; esac
          mkdir -p out
          set +e
          python -m "$MODULO" $ARGS --salida out > out/salida.txt 2>&1
          echo "codigo=$?" >> out/salida.txt
          tail -n 20 out/salida.txt
          echo "NOMBRE=${{ strategy.job-index }}" >> "$GITHUB_ENV"
      - name: Subir este tramo a sondas (por_tramo=si)
        if: always() && inputs.por_tramo == 'si'
        env:
          MODULO: ${{ inputs.modulo }}
        run: |
          # Igual que en «juntar»: las páginas de webs de centros no se publican (solo su índice)
          rm -rf out/archivo/web-centros
          STAMP=$(date -u +%Y%m%dT%H%M%S)-t${{ strategy.job-index }}
          mkdir -p "pub/$STAMP" && cp -r out/. "pub/$STAMP/"
          find pub -type f -size +90M -exec gzip -9 {} \;
          grep -rlE '(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{24,}' pub 2>/dev/null \
            | xargs -r sed -i -E 's/(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{24,}/[retirado]/g'
          cd pub
          git init -q && git config user.name "motor-estudios" && git config user.email "motor-estudios@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin sondas; then git reset -q FETCH_HEAD; fi
          git checkout -q -B sondas
          git add "$STAMP" && git commit -qm "Estudios, tramo ${{ strategy.job-index }}: $MODULO"
          for i in 1 2 3 4 5 6; do
            git push -q origin sondas && exit 0
            sleep $((i * 10))
            git fetch -q --depth 1 origin sondas && git reset -q FETCH_HEAD && git add "$STAMP" \
              && git commit -qm "Estudios, tramo ${{ strategy.job-index }}: $MODULO" || true
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always() && inputs.por_tramo != 'si'
        with:
          name: tramo-${{ env.NOMBRE }}
          path: out
          retention-days: 7
      - name: Limpiar la copia local (en el servidor propio no queda nada entre ejecuciones)
        if: always() && inputs.ejecutor == 'espana'
        run: rm -rf out entrada pub

  juntar:
    needs: tramo
    if: always() && inputs.por_tramo != 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sin grupo de concurrencia: el grupo «rama-sondas» lo comparten otros flujos y una espera allí puede
    # cancelarse. Cada ejecución añade una carpeta propia, así que basta con reintentar el push.
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: tramos
      - name: Subir a la rama sondas
        env:
          MODULO: ${{ inputs.modulo }}
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%S)
          mkdir -p "pub/$STAMP"
          for d in tramos/*/; do
            n=$(basename "$d")
            cp "$d/salida.txt" "pub/$STAMP/$n.salida.txt" 2>/dev/null || true
            # Ficheros de distintos tramos con el mismo nombre (hechos.jsonl, resumen.json…) no se pisan: se
            # guardan numerados (fichero.~1~) y se avisa. La extracción y la clasificación ya escriben cada tramo
            # en su propia carpeta.
            if [ -d "$d/datos" ]; then cp -r --backup=numbered "$d/datos" "pub/$STAMP/"; fi
            # Las páginas de webs de centros no se publican: la rama es pública y son textos ajenos. Solo se sube
            # su índice (URL, fecha, huella sha256 y clave del original en el almacén privado de S3).
            rm -rf "$d/archivo/web-centros"
            if [ -d "$d/archivo" ]; then mkdir -p "pub/$STAMP/archivo"; cp -r "$d/archivo/." "pub/$STAMP/archivo/"; cat "$d/archivo/indice.jsonl" >> "pub/$STAMP/archivo/indice_todos.jsonl" 2>/dev/null || true; fi
          done
          n_rep=$(find pub -name '*.~[0-9]*~' | wc -l); [ "$n_rep" -gt 0 ] && echo "::warning::$n_rep ficheros con el mismo nombre en varios tramos, guardados numerados"
          # GitHub rechaza ficheros de más de 100 MB: los grandes se comprimen (y se ve qué pesa)
          find pub -type f -size +90M -print -exec gzip -9 {} \;
          du -sh pub/$STAMP; find pub -type f -size +20M -exec ls -lh {} \;
          # Red de seguridad: claves ajenas que aparecen en URL públicas no se suben (la rama es pública)
          grep -rlE '(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{24,}' pub 2>/dev/null \
            | xargs -r sed -i -E 's/(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{24,}/[retirado]/g'
          cd pub
          git init -q && git config user.name "motor-estudios" && git config user.email "motor-estudios@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin sondas; then git reset -q FETCH_HEAD; fi
          git checkout -q -B sondas
          git add "$STAMP" && git commit -qm "Estudios por tramos: $MODULO"
          for i in 1 2 3 4 5 6; do
            git push -q origin sondas && exit 0
            sleep $((i * 10))
            # la carpeta $STAMP es solo de esta ejecución: se rehace el commit sobre lo último de la rama (con
            # historial de profundidad 1, «git rebase» no encuentra la base común y choca con todo el árbol)
            git fetch -q --depth 1 origin sondas && git reset -q FETCH_HEAD && git add "$STAMP" \
              && git commit -qm "Estudios por tramos: $MODULO" || true
          done
          exit 1
