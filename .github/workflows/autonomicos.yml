name: Boletines autonómicos

# Boletines de las comunidades con conector: Andalucía (BOJA), Madrid (BOCM), Castilla y León (BOCYL),
# Comunitat Valenciana (DOGV), Galicia (DOG), Cataluña (DOGC), Aragón (BOA), Extremadura (DOE),
# Illes Balears (BOIB), Región de Murcia (BORM), Canarias (BOC), País Vasco (BOPV), Castilla-La Mancha (DOCM)
# Melilla (BOME), y Asturias (BOPA), Navarra (BON) y Cantabria (BOC), que solo responden desde España y van en el
# servidor propio; y provinciales: Barcelona (BOPB), Tarragona (BOPT), Alicante, Valencia, Ciudad Real, Granada, Sevilla, Huesca, Santa Cruz de Tenerife, Córdoba, A Coruña y Pontevedra.
#
# Un trabajo por boletín, en paralelo: cada uno pide a su propia fuente (una petición por segundo como mucho),
# escribe solo en su carpeta de la rama «datos» y su propio índice de originales, así que las subidas no chocan
# (si coinciden en el tiempo, se reintenta tras rebase).
# El repositorio es público: los ejecutores estándar de GitHub no consumen minutos de pago
# (https://docs.github.com/en/billing/concepts/product-billing/github-actions). Límite: 6 horas por trabajo.
# Primero lo del día, luego la carga histórica pendiente y después los textos; todo es reanudable.
# Los originales van al almacén privado S3 (boletin.yml); a la rama «datos» solo van los datos y la huella.

on:
  schedule:
    - cron: "17 7 * * *"   # 08:17 / 09:17 en Madrid según horario
  workflow_dispatch:
    inputs:
      minutos:
        description: "Minutos máximos por boletín para la carga histórica y, aparte, para los textos"
        default: "60"
      minutos_espana:
        description: "Lo mismo para los boletines del servidor de España, que van de uno en uno"
        default: "30"
      conectores:
        description: "Conectores, separados por espacios"
        default: "boja bocm bocyl dogv dog dogc boa doe boib borm boc bopv docm bome bopb bopalicante bopvalencia bopt bopciudadreal bopgranada bopsevilla bophuesca boptenerife bopcordoba bopcoruna boppontevedra bopavila bopbadajoz bopzamora boptoledo bopalava bopzaragoza bopjaen bopalbacete bopsalamanca bopgipuzkoa bopbizkaia boplugo bophuelva boplaspalmas bopvalladolid bopcaceres bopguadalajara bopgirona bopourense boplleida boppalencia bopsoria bopteruel bopcastellon bopleon bopcadiz bocce bopa bon bocant bopburgos bor"

permissions:
  contents: write
  id-token: write   # credenciales temporales del almacén S3 de originales (OIDC)

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
      lista_espana: ${{ steps.lista.outputs.lista_espana }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar y probar
        run: |
          # Todos los extras de pyproject.toml: las pruebas de otras partes (SEO, másters) también tienen que pasar
          pip install -e ".[$(python -c "import tomllib; print(','.join(tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']))")]"
          python -m pytest -q
      - id: lista
        env:
          CONECTORES: ${{ inputs.conectores || 'boja bocm bocyl dogv dog dogc boa doe boib borm boc bopv docm bome bopb bopalicante bopvalencia bopt bopciudadreal bopgranada bopsevilla bophuesca boptenerife bopcordoba bopcoruna boppontevedra bopavila bopbadajoz bopzamora boptoledo bopalava bopzaragoza bopjaen bopalbacete bopsalamanca bopgipuzkoa bopbizkaia boplugo bophuelva boplaspalmas bopvalladolid bopcaceres bopguadalajara bopgirona bopourense boplleida boppalencia bopsoria bopteruel bopcastellon bopleon bopcadiz bocce bopa bon bocant bopburgos bor' }}
          # Solo responden desde España (sondas del 30/10/2026): van al servidor propio
          ESPANA: "bopa bon bocant bocce bopteruel bopgipuzkoa bophuelva boplleida bopvalladolid bopzaragoza bopjaen bopalbacete bopsalamanca bopburgos bor"
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          todos, espana = os.environ["CONECTORES"].split(), set(os.environ["ESPANA"].split())
          print("lista=" + json.dumps([c for c in todos if c not in espana]))
          print("lista_espana=" + json.dumps([c for c in todos if c in espana]))
          EOF

  boletin:
    needs: preparar
    if: needs.preparar.outputs.lista != '[]'   # una tanda solo con boletines del servidor de España
    strategy:
      fail-fast: false
      # El plan gratuito admite 20 trabajos a la vez en todo el repositorio (también los de másters):
      # como mucho 10 boletines a la vez para dejar sitio a los demás flujos.
      max-parallel: 10
      matrix:
        conector: ${{ fromJSON(needs.preparar.outputs.lista) }}
    uses: ./.github/workflows/boletin.yml
    with:
      conector: ${{ matrix.conector }}
      minutos: ${{ inputs.minutos || '60' }}
      ejecutor: github

  # Boletines que no responden a los servidores de GitHub (fuera de España): en el servidor propio, de uno en uno
  boletin-espana:
    needs: preparar
    if: needs.preparar.outputs.lista_espana != '[]'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        conector: ${{ fromJSON(needs.preparar.outputs.lista_espana) }}
    uses: ./.github/workflows/boletin.yml
    with:
      conector: ${{ matrix.conector }}
      # De uno en uno: con menos minutos por boletín la tanda entera cabe en la mañana
      minutos: ${{ inputs.minutos_espana || '30' }}
      ejecutor: espana
