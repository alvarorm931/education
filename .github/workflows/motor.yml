name: Motor de datos

# BOE dos veces al día (sale de madrugada; la segunda pasada recoge extraordinarios y reintentos).
# Los boletines autonómicos van en su propio flujo (autonomicos.yml).
# Cada paso tiene su tiempo máximo. Todo es reanudable: si una ejecución falla o se cancela, la siguiente
# recupera lo que faltó (días sin procesar, textos pendientes).
# El repositorio es público: los ejecutores estándar de GitHub no consumen minutos de pago
# (https://docs.github.com/en/billing/concepts/product-billing/github-actions). Límite: 6 horas por trabajo.
# Mientras quede carga histórica de textos, cada pasada dedica a los textos hasta 150 minutos.

on:
  schedule:
    - cron: "47 6 * * *"   # 07:47 / 08:47 en Madrid según horario
    - cron: "47 13 * * *"  # 14:47 / 15:47 en Madrid
  workflow_dispatch:
    inputs:
      minutos_textos:
        description: "Minutos máximos para textos del BOE"
        default: "150"

permissions:
  contents: write

concurrency:
  group: rama-datos
  cancel-in-progress: false

jobs:
  motor:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MIN_TEXTOS: ${{ inputs.minutos_textos || '150' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar y probar
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Preparar rama de datos
        run: |
          git config user.name "motor-datos"
          git config user.email "motor-datos@users.noreply.github.com"
          git fetch --depth 1 origin datos
          git worktree add -B datos salida origin/datos
          cat > guardar.sh <<'EOF'
          #!/usr/bin/env bash
          # Guarda y sube lo que haya cambiado. Si la subida choca con otra, reintenta tras rebase.
          cd salida
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "$1"
          for i in 1 2 3 4 5 6 7 8; do
            git push -q origin datos && exit 0
            sleep $(( i * 4 + RANDOM % 7 ))
            git fetch -q --depth 100 origin datos && git rebase -q origin/datos || { git rebase --abort; echo "::warning::$1: la subida choca con otra"; exit 1; }
          done
          echo "::warning::$1: no se pudo subir"
          exit 1
          EOF
          chmod +x guardar.sh

      - name: BOE de ayer y de hoy
        run: |
          python -m motor.boe --salida salida | tail -n 12 || echo "::warning::BOE con alertas"
          ./guardar.sh "BOE: ayer y hoy"

      - name: BOE, días que falten desde 2022
        run: |
          AYER=$(TZ=Europe/Madrid date -d yesterday +%F)
          python -m motor.boe --salida salida --desde 2022-01-01 --hasta "$AYER" --saltar-existentes --pausa 0.7 | tail -n 5 || true
          ./guardar.sh "BOE: recuperación de días pendientes"

      - name: BOE, textos de anuncios de oposiciones
        run: |
          # Por tandas de 1.500 documentos, guardando tras cada una para no perder avance si se corta.
          FIN=$(( $(date +%s) + MIN_TEXTOS * 60 ))
          while [ "$(date +%s)" -lt "$FIN" ]; do
            RESTA=$(( (FIN - $(date +%s)) / 60 ))
            [ "$RESTA" -lt 1 ] && break
            python -m motor.boe.texto --pendientes --salida salida --max 1500 --max-minutos "$RESTA" | tee tanda.txt | tail -n 3 || true
            ./guardar.sh "BOE: textos de anuncios"
            grep -q "Documentos a descargar: 0" tanda.txt && break
          done

      - name: Extraer actos y comprobar huecos
        run: |
          python -m motor.boe.extraer --salida salida
          python -m motor.autonomicos.actos --salida salida
          python -m motor.procesos --salida salida
          python -m motor.boe.huecos --salida salida
          python -m motor.estado --salida salida || true
          ./guardar.sh "Actos y control de huecos"

      - name: Avisar si hay huecos o errores
        run: |
          python - <<'EOF'
          import json, sys
          h = json.load(open("salida/datos/boe/huecos.json"))
          problemas = {k: v for k, v in h.items() if k in ("numeros_de_diario_que_faltan", "dias_sin_procesar", "dias_con_error") and v}
          if problemas:
              print("::error::Huecos en el BOE: " + json.dumps(problemas, ensure_ascii=False)[:500])
              sys.exit(1)
          print("Sin huecos en el BOE. Anuncios sin texto:", h.get("anuncios_sin_texto"))
          EOF

      - name: Resumen legible por la API
        if: always()
        run: |
          python - <<'EOF'
          import json, pathlib
          partes = []
          h = pathlib.Path("salida/datos/boe/huecos.json")
          if h.exists():
              partes.append("anuncios sin texto " + str(json.loads(h.read_text()).get("anuncios_sin_texto")))
          r = pathlib.Path("salida/datos/oposiciones/resumen.json")
          if r.exists():
              d = json.loads(r.read_text())
              partes.append(f"procesos {d.get('procesos')}, por estado {d.get('por_estado')}, "
                            f"plazo abierto {d['plazo_abierto']['procesos']} procesos y {d['plazo_abierto']['plazas']} plazas")
          print("::notice title=Resumen BOE::" + "; ".join(partes))
          EOF
