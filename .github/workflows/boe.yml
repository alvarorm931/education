name: Conector BOE

on:
  schedule:
    - cron: "17 5 * * *"   # 06:17 en Madrid (horario de invierno)
    - cron: "17 13 * * *"  # 14:17 en Madrid (horario de invierno)
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial AAAA-MM-DD (vacío = ayer)"
        required: false
      hasta:
        description: "Fecha final AAAA-MM-DD (vacío = hoy)"
        required: false

permissions:
  contents: write

concurrency:
  group: rama-datos
  cancel-in-progress: false

jobs:
  boe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar y probar
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Preparar rama de datos
        run: |
          git config user.name "motor-boe"
          git config user.email "motor-boe@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin datos >/dev/null; then
            git fetch --depth 1 origin datos
            git worktree add -B datos salida origin/datos
          else
            git worktree add --detach salida
            cd salida
            git checkout --orphan datos
            git rm -rfq .
          fi

      - name: Ejecutar conector
        id: motor
        env:
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: |
          set +e
          ARGS="--salida salida"
          [ -n "$DESDE" ] && ARGS="$ARGS --desde $DESDE"
          [ -n "$HASTA" ] && ARGS="$ARGS --hasta $HASTA"
          python -m motor.boe $ARGS
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: Textos nuevos y extracción de actos
        run: |
          python -m motor.boe.texto --pendientes --salida salida --max 600 --max-minutos 30 | head -n 20 || true
          python -m motor.boe.extraer --salida salida
          python -m motor.boe.huecos --salida salida || true

      - name: Guardar resultados en la rama datos
        run: |
          cd salida
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -qm "BOE: captura $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin datos
          fi

      - name: Fallar si hubo errores de fuente o de formato
        if: steps.motor.outputs.codigo != '0'
        run: |
          echo "El conector terminó con errores: revisar el resumen y datos/boe/estado.json"
          exit 1
