[project]
name = "motor"
version = "0.1.0"
description = "Motor de captura y extracción de datos públicos para el portal de estudios y oposiciones"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
