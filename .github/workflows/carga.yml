name: Carga histórica BOE

# Reanudable: cada ejecución sigue donde se quedó la anterior y guarda el avance cada 1.500 documentos.
# Programada cada dos horas hasta completar; cuando no queda nada pendiente termina en un par de minutos.

on:
  workflow_dispatch:
    inputs:
      desde:
        description: "Fecha inicial AAAA-MM-DD"
        default: "2022-01-01"
      hasta:
        description: "Fecha final AAAA-MM-DD (vacío = ayer)"
        required: false
      minutos:
        description: "Minutos máximos para descargar textos"
        default: "300"
  schedule:
    - cron: "41 */2 * * *"

permissions:
  contents: write

concurrency:
  group: rama-datos
  cancel-in-progress: false

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DESDE: ${{ inputs.desde || '2022-01-01' }}
      HASTA: ${{ inputs.hasta }}
      MINUTOS: ${{ inputs.minutos || '100' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar y probar
        run: |
          pip install -e ".[dev]"
          python -m pytest -q

      - name: Preparar rama de datos
        run: |
          git config user.name "motor-boe"
          git config user.email "motor-boe@users.noreply.github.com"
          git fetch --depth 1 origin datos
          git worktree add -B datos salida origin/datos
          rm -f salida/datos/boe/textos/BOE-*.json

      - name: Sumarios (solo los días que faltan)
        run: |
          [ -z "$HASTA" ] && HASTA=$(TZ=Europe/Madrid date -d yesterday +%F)
          python -m motor.boe --salida salida --desde "$DESDE" --hasta "$HASTA" --saltar-existentes --pausa 0.7 > resumen.md || true
          tail -n 40 resumen.md
          cd salida && git add -A && { git diff --cached --quiet || { git commit -qm "BOE: carga histórica de sumarios"; git push -q origin datos; }; }

      - name: Textos de los anuncios de oposiciones
        run: |
          FIN=$(( $(date +%s) + MINUTOS * 60 ))
          while [ "$(date +%s)" -lt "$FIN" ]; do
            RESTA=$(( (FIN - $(date +%s)) / 60 ))
            [ "$RESTA" -lt 2 ] && break
            python -m motor.boe.texto --pendientes --salida salida --max 1500 --max-minutos "$RESTA" | tee salida_texto.txt | head -n 3
            ( cd salida && git add -A && { git diff --cached --quiet || { git commit -qm "BOE: textos de anuncios"; git push -q origin datos; }; } )
            grep -q "Documentos a descargar: 0" salida_texto.txt && break
          done

      - name: Extraer actos y comprobar huecos
        run: |
          python -m motor.boe.extraer --salida salida
          python -m motor.boe.huecos --salida salida --desde "$DESDE"
          cd salida && git add -A && { git diff --cached --quiet || { git commit -qm "BOE: actos y control de huecos"; git push -q origin datos; }; }
