# Registro de fuentes. Cada fuente: qué da, cómo se conecta, frecuencia esperada,
# licencia, respaldo y estado de verificación (verificada / por_verificar / sin_fuente_central).
# Revisado: 29/10/2026.

fuentes:
  - id: boe-sumario
    nombre: BOE · API del sumario diario
    modulo: [oposiciones, carreras, fp, becas]
    url: https://boe.es/datosabiertos/api/boe/sumario/{AAAAMMDD}
    metodo: api_xml
    cabecera_accept: application/xml
    frecuencia: diaria de lunes a sábado, con números extraordinarios
    licencia: Reutilización del BOE (uso comercial, citar fuente y fecha, sin aparentar carácter oficial)
    doc: https://boe.es/datosabiertos/documentos/APIsumarioBOE.pdf
    respaldo: [boe-rss-2b, boe-pdf-dia]
    control: numeración correlativa del diario y de BOE-A
    estado: verificada
    conector: motor/boe

  - id: boe-rss-2b
    nombre: BOE · RSS sección II.B Oposiciones y concursos
    modulo: [oposiciones]
    url: https://www.boe.es/rss/boe.php?s=2B
    metodo: rss
    frecuencia: diaria
    licencia: Reutilización del BOE
    estado: verificada

  - id: boe-pdf-dia
    nombre: BOE · PDF de cada disposición
    url: https://www.boe.es/boe/dias/{AAAA}/{MM}/{DD}/pdfs/{ID}.pdf
    metodo: pdf
    nota: único documento oficial y auténtico
    estado: verificada

  - id: boe-consolidada
    nombre: BOE · API de legislación consolidada
    modulo: [oposiciones-test, normativa]
    url: https://www.boe.es/datosabiertos/api/legislacion-consolidada
    metodo: api_xml
    frecuencia: 1 a 3 días tras cada publicación
    licencia: Reutilización del BOE; rotular texto consolidado como informativo
    doc: https://www.boe.es/datosabiertos/documentos/APIconsolidada.pdf
    estado: verificada

  - id: pag-empleo
    nombre: Punto de Acceso General · buscador de empleo público
    modulo: [oposiciones]
    url: https://administracion.gob.es/pagFront/empleoBecas/empleo/buscadorEmpleoAvanzado.htm
    metodo: exportacion_csv_xml
    limite: 10000 filas por exportación
    uso: control de cobertura, no fuente principal
    estado: verificada

  - id: boja-datos-abiertos
    nombre: BOJA · disposiciones por año (datos abiertos)
    modulo: [oposiciones]
    url: https://www.juntadeandalucia.es/datosabiertos/portal/dataset?tags=BOJA
    metodo: dataset
    licencia: CC BY 4.0
    estado: verificada

  - id: bopv-ultimo
    nombre: BOPV · último boletín en XML
    modulo: [oposiciones]
    url: https://www.euskadi.eus/bopv2/datos/Ultimo.xml
    metodo: xml
    nota: codificación ISO-8859-1 según fuente secundaria
    estado: verificada

  - id: bocm-rss
    nombre: BOCM · RSS
    modulo: [oposiciones]
    url: https://www.bocm.es/rss
    metodo: rss
    estado: por_verificar

  - id: ruct
    nombre: RUCT · Registro de Universidades, Centros y Títulos
    modulo: [carreras, masters]
    url: https://www.educacion.gob.es/ruct/estudio.action?codigoCiclo=SC&codigoTipo={G|M}&CodigoEstudio={CODIGO}&actual=estudios
    metodo: html
    identificador: código de título de 7 cifras; memoria con código de 17 cifras (título + fecha + orden)
    da: >-
      ficha (créditos por tipo, fechas, BOE del acuerdo y del plan, CCAA, extinción, acreditaciones, centros,
      histórico de memorias) y memoria vigente (profesión regulada, conjunto, plazas por centro y modalidad,
      idiomas, acceso y admisión, módulos, materias y asignaturas con ECTS y semestre; en memorias del
      formato RD 1393/2007, horas por actividad y ponderación mínima y máxima de la evaluación por materia)
    sesion: las páginas de la memoria dependen de la cookie de sesión; recorrer cada memoria en orden
    coste: 1 petición por ficha; 15-150 por memoria
    riesgo: cambio de dominio de la sede; caídas intermitentes vistas desde GitHub el 29/10/2026
    estado: verificada
    conector: motor/estudios/ruct.py
    verificado: 2026-10-29

  - id: siiu-clasificaciones
    nombre: Ministerio · Clasificaciones estadísticas universitarias (SIIU)
    modulo: [carreras, masters]
    url: https://www.ciencia.gob.es/Ministerio/Estadisticas/SIIU/Clasificaciones.html
    metodo: xlsx_anual
    da: >-
      catálogo de todos los títulos oficiales (código RUCT) por centro con situación, presencialidad e
      idioma; rama, campo e ISCED; centros con código de 8 cifras y municipio; universidades
    frecuencia: anual (curso 2025-2026 a fecha febrero de 2026); enlaces nuevos cada año
    licencia: estadística oficial; citar «Ministerio de Ciencia, Innovación y Universidades. SIIU»
    uso: universo de másters oficiales (simples y dobles, códigos 75xxxxx) y modalidad por centro
    estado: verificada
    conector: motor/estudios/catalogo.py
    verificado: 2026-10-29

  - id: boe-masters
    nombre: BOE · planes de estudios y acuerdos de carácter oficial de másters
    modulo: [masters]
    url: sumario diario del BOE (sección III, Universidades; acuerdos del Consejo de Ministros)
    metodo: filtro del sumario ya capturado + texto XML de cada disposición
    da: altas de títulos con código RUCT; tablas del plan (nivel desigual por universidad)
    medido: >-
      100 planes 2022-2026 al azar: 95 con tablas de créditos, 46 con nombre de asignatura, 51 con periodo,
      16 sin filas extraíbles. Se usa como fuente oficial y control; la estructura sale del RUCT
    estado: verificada
    conector: motor/estudios/boe_masters.py

  - id: tarifas-privadas
    nombre: Tarifas de máster de las universidades privadas (PDF en su web)
    modulo: [masters]
    metodo: pdf por universidad, captura anual
    ejemplos: >-
      Universidad Europea de Andalucía (9 másteres, reserva y docencia), Universidad Alfonso X (unos 33),
      Universidad Francisco de Vitoria (27, con 6 títulos propios)
    aviso: el «precio a efectos de beca» que publican algunas (UDIMA, 28 €/ECTS) no es el precio de venta
    estado: sin_fuente_central

  - id: qedu
    nombre: QEDU · Qué estudiar y dónde en la universidad
    modulo: [carreras, masters, notas]
    url: https://www.ciencia.gob.es/qedu.html
    metodo: exportacion_csv_xlsx
    da: >-
      grados, másteres y doctorados oficiales de públicas y privadas (nota del Ministerio del 13/2/2025);
      según su ayuda, el «precio del crédito» es el de primera matrícula en universidades públicas y las
      plazas solo de públicas; la lista de titulaciones se descarga en XLSX o CSV; no dice que enlace a la
      web de cada título (https://www.ciencia.gob.es/gl/qedu/AyudaQEDU.html, consultada el 30/10/2026)
    riesgo: inestable en la revisión
    estado: por_verificar

  - id: commoncrawl-indice
    nombre: Common Crawl · índice columnar de URL (cc-index-table)
    modulo: [masters]
    url: https://data.commoncrawl.org/crawl-data/{crawl}/cc-index-table.paths.gz
    metodo: parquet por crawl, leído con DuckDB por HTTP (solo metadatos de URL, sin contenido)
    da: dominios con rutas de programa de posgrado (descubrimiento de proveedores sin registro oficial)
    medido: >-
      CC-MAIN-2026-43 completo (300 ficheros): 70.912 dominios con el patrón amplio; tras quitar otros
      países, páginas sueltas, agregadores y URL sin programa, 10.955 candidatos nuevos fuera del RUCT
    riesgo: "limita la velocidad (403) si se pide en paralelo; un crawl no ve todo, se suman varios"
    licencia: términos de uso de Common Crawl; no se copia contenido
    estado: verificada
    conector: motor/estudios/commoncrawl.py
    verificado: 2026-10-29

  - id: web-centros
    nombre: Webs de universidades, centros y escuelas (robots.txt, sitemaps, listados y fichas)
    modulo: [masters]
    metodo: html; una petición por segundo y servidor, robots.txt de cada servidor, reserva TDM respetada
    da: >-
      URL de cada programa con su fecha de cambio (lastmod), texto del enlace (nombre), medición de lo que
      enseña sin pedir datos, PDF de tarifas y páginas de centros colaboradores
    copias: >-
      original intacto en el almacén privado S3 (web-centros/AAAA/MM/DD/{sha256}.html.gz o .pdf.gz, escritura
      única); en la rama pública, URL, fecha y huella
    estado: verificada
    conector: motor/estudios/rastreador.py, motor/estudios/extraer.py, motor/estudios/tarifas.py
    medido: >-
      30/10/2026: 2.978 páginas de másters oficiales, 13.005 de centros no universitarios y 5.254 de títulos
      propios en webs oficiales leídas en una noche; menos del 1 % vetadas por robots.txt, ninguna con reserva TDM
    verificado: 2026-10-30

  - id: claude-lote
    nombre: API de Claude · Message Batches (Claude Haiku 5.5)
    modulo: [masters]
    url: https://api.anthropic.com/v1/messages/batches
    metodo: >-
      lote con salida estructurada o JSON compacto, sin pensamiento y esfuerzo bajo; cita literal de cada dato
      comprobada sin IA contra la página
    da: >-
      campos de la ficha de cada máster (extraer.py), clasificación de proveedores (clasificar.py) y precios de
      tarifas en PDF (tarifas.py)
    coste: >-
      medido el 30/10/2026: 0,0004-0,0006 $ por página de programa; 0,00013 $ por portada clasificada
    copias: lo enviado, las respuestas y las citas, solo en el almacén privado (extraccion-masters/…)
    clave: secreto ANTHROPIC_API_KEY de GitHub; solo lo reciben los módulos que llaman a la API
    estado: verificada
    verificado: 2026-10-30

  - id: notas-madrid
    nombre: Distrito único de Madrid · notas de corte
    modulo: [notas]
    url: https://www.uc3m.es/ss/Satellite/UC3MInstitucional/es/TextoMixta/1371206740815/Notas_de_admision
    metodo: pdf
    historico: 2007-08 a 2026-27
    estado: verificada

  - id: notas-galicia
    nombre: CiUG · notas de corte
    modulo: [notas]
    url: https://ciug.gal/PDF/ACCESO2024/notas_corte.pdf
    metodo: pdf
    estado: verificada

  - id: notas-murcia
    nombre: Universidad de Murcia · datos abiertos de notas de corte
    modulo: [notas]
    url: https://datos.um.es
    metodo: ckan
    licencia: CC0 o CC BY-SA (por confirmar con la universidad)
    estado: verificada
