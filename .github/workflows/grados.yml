name: Grados por tramos

# Ejecuta un módulo de motor/grados en varios tramos (matriz) y junta los resultados en un solo commit
# en la rama "sondas". Evita que las pruebas encoladas se cancelen entre sí y permite tramos de hasta 55
# minutos. Con la misma fuente (p. ej. el RUCT) usar paralelo=1 para no pasar de una petición por segundo.

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: "Módulo (por ejemplo motor.grados.ruct_grados)"
        required: true
      tramos:
        description: 'Lista JSON de argumentos, uno por tramo: ["--desde 0 --hasta 37", "--desde 37 --hasta 73"]'
        required: true
      paralelo:
        description: "Tramos a la vez (1 si todos van a la misma fuente)"
        default: "1"
      entrada:
        description: "Rutas de la rama sondas que necesita el módulo, separadas por espacios (quedan en ./entrada/)"
        required: false
        default: ""
      por_tramo:
        description: "si: cada tramo sube sus resultados a sondas al terminar (para usarlos sin esperar al resto)"
        type: choice
        options: ["no", "si"]
        default: "no"
      ejecutor:
        description: "Dónde se ejecuta: github o espana (servidor propio, para fuentes que no responden a GitHub)"
        type: choice
        options: [github, espana]
        default: github

permissions:
  contents: write

jobs:
  tramo:
    # Credenciales temporales del almacén de originales por OIDC (claude/infraestructura.md); sin claves
    permissions:
      contents: write   # solo para subir el tramo a sondas con por_tramo=si
      id-token: write
    runs-on: ${{ inputs.ejecutor == 'espana' && fromJSON('["self-hosted", "espana"]') || 'ubuntu-latest' }}
    timeout-minutes: 58
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.paralelo) }}
      matrix:
        args: ${{ fromJSON(inputs.tramos) }}
    steps:
      # En el servidor propio la carpeta de trabajo se conserva entre ejecuciones: se empieza de cero
      - name: Limpiar restos de ejecuciones anteriores
        run: rm -rf out entrada
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[estudios,almacen]"
      # lectura óptica de PDF sin texto (notas de corte de la UPV/EHU desde 2022-23), solo si el tramo la pide
      - name: Instalar tesseract (tramos con --ocr)
        if: contains(matrix.args, '--ocr') && inputs.ejecutor != 'espana'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa poppler-utils
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::369017477131:role/education-originales-github
          aws-region: eu-south-2
          role-session-name: grados-${{ github.run_id }}
      - name: Traer entradas de la rama sondas
        if: inputs.entrada != ''
        env:
          RUTAS: ${{ inputs.entrada }}
        run: |
          git fetch -q --depth 1 --filter=blob:none origin sondas
          mkdir -p entrada
          for r in $RUTAS; do
            git archive FETCH_HEAD "$r" | tar -x -C entrada
          done
          find entrada -maxdepth 6 -type d | head -20
      - name: Ejecutar
        env:
          MODULO: ${{ inputs.modulo }}
          ARGS: ${{ matrix.args }}
          # Originales enteros al almacén privado (escritura única); en la rama pública solo su índice y huella
          MOTOR_ORIGINALES: s3
        run: |
          case "$MODULO" in motor.grados.*) ;; *) echo "Módulo no permitido"; exit 1;; esac
          mkdir -p out
          set +e
          python -m "$MODULO" $ARGS --salida out > out/salida.txt 2>&1
          echo "codigo=$?" >> out/salida.txt
          tail -n 20 out/salida.txt
          echo "NOMBRE=${{ strategy.job-index }}" >> "$GITHUB_ENV"
      - name: Subir este tramo a sondas (por_tramo=si)
        if: always() && inputs.por_tramo == 'si'
        run: |
          rm -rf out/archivo/web-centros
          STAMP=$(date -u +%Y%m%dT%H%M%S)-t${{ strategy.job-index }}
          mkdir -p "pub/$STAMP" && cp -r out/. "pub/$STAMP/"
          find pub -type f -size +90M -exec gzip -9 {} \;
          grep -rlE '(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{24,}' pub 2>/dev/null \
            | xargs -r sed -i -E 's/(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{24,}/[retirado]/g'
          cd pub
          git init -q && git config user.name "motor-grados" && git config user.email "motor-grados@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin sondas; then git reset -q FETCH_HEAD; fi
          git checkout -q -B sondas
          git add "$STAMP" && git commit -qm "Grados, tramo ${{ strategy.job-index }}: $MODULO"
          for i in 1 2 3 4 5 6; do
            git push -q origin sondas && exit 0
            sleep $((i * 10))
            git fetch -q --depth 1 origin sondas && git reset -q FETCH_HEAD && git add "$STAMP" \
              && git commit -qm "Grados, tramo ${{ strategy.job-index }}: $MODULO" || true
          done
          exit 1
        env:
          MODULO: ${{ inputs.modulo }}
      - name: Borrar la copia local (servidor propio)
        if: always() && inputs.ejecutor == 'espana'
        run: rm -rf pub
      - uses: actions/upload-artifact@v4
        if: always() && inputs.por_tramo != 'si'
        with:
          name: tramo-${{ env.NOMBRE }}
          path: out
          retention-days: 7

  juntar:
    needs: tramo
    if: always() && inputs.por_tramo != 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sin grupo de concurrencia: el grupo «rama-sondas» lo comparten otros flujos y una espera allí puede
    # cancelarse. Cada ejecución añade una carpeta propia, así que basta con reintentar el push.
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: tramos
      - name: Subir a la rama sondas
        env:
          MODULO: ${{ inputs.modulo }}
        run: |
          STAMP=$(date -u +%Y%m%dT%H%M%S)
          mkdir -p "pub/$STAMP"
          for d in tramos/*/; do
            n=$(basename "$d")
            cp "$d/salida.txt" "pub/$STAMP/$n.salida.txt" 2>/dev/null || true
            if [ -d "$d/datos" ]; then cp -r "$d/datos" "pub/$STAMP/"; fi
            # Las páginas de webs de centros no se publican: la rama es pública y son textos ajenos. Solo se sube
            # su índice (URL, fecha, huella sha256); el original irá al archivo privado (R2) cuando exista.
            rm -rf "$d/archivo/web-centros"
            if [ -d "$d/archivo" ]; then mkdir -p "pub/$STAMP/archivo"; cp -r "$d/archivo/." "pub/$STAMP/archivo/"; cat "$d/archivo/indice.jsonl" >> "pub/$STAMP/archivo/indice_todos.jsonl" 2>/dev/null || true; fi
          done
          # GitHub rechaza ficheros de más de 100 MB: los grandes se comprimen (y se ve qué pesa)
          find pub -type f -size +90M -print -exec gzip -9 {} \;
          du -sh pub/$STAMP; find pub -type f -size +20M -exec ls -lh {} \;
          # Red de seguridad: claves ajenas que aparecen en URL públicas no se suben (la rama es pública)
          grep -rlE '(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{24,}' pub 2>/dev/null \
            | xargs -r sed -i -E 's/(AKIA|ASIA)[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|gh[pousr]_[A-Za-z0-9]{36}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[0-9a-zA-Z]{24,}/[retirado]/g'
          cd pub
          git init -q && git config user.name "motor-grados" && git config user.email "motor-grados@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin sondas; then git reset -q FETCH_HEAD; fi
          git checkout -q -B sondas
          git add "$STAMP" && git commit -qm "Grados por tramos: $MODULO"
          for i in 1 2 3 4 5 6; do
            git push -q origin sondas && exit 0
            sleep $((i * 10))
            # la carpeta $STAMP es solo de esta ejecución: se rehace el commit sobre lo último de la rama (con
            # historial de profundidad 1, «git rebase» no encuentra la base común y choca con todo el árbol)
            git fetch -q --depth 1 origin sondas && git reset -q FETCH_HEAD && git add "$STAMP" \
              && git commit -qm "Grados por tramos: $MODULO" || true
          done
          exit 1
