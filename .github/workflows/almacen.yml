name: Prueba del almacén de originales

# Comprueba de punta a punta el acceso al almacén privado de S3 (education-originales-finads, eu-south-2) sin
# claves: GitHub pide credenciales temporales por OIDC al rol education-originales-github, que solo pueden asumir
# los flujos de la rama main. La prueba sube un objeto bajo pruebas-almacen/, lo lee, comprueba su huella y que
# una segunda escritura en la misma clave se rechaza (If-None-Match: *). No borra nada: el rol no puede.

on:
  workflow_dispatch:
    inputs:
      ejecutor:
        description: "Dónde se ejecuta: github (servidores de GitHub) o espana (servidor propio en España)"
        type: choice
        options: [github, espana]
        default: github

permissions:
  id-token: write   # para pedir el token OIDC que canjea AWS
  contents: read

jobs:
  prueba:
    runs-on: ${{ inputs.ejecutor == 'espana' && fromJSON('["self-hosted", "espana"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Limpiar restos de ejecuciones anteriores
        run: rm -rf codigo
      - uses: actions/checkout@v4
        with:
          path: codigo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -e "./codigo[almacen]"
      # Diagnóstico: qué identidad presenta GitHub a AWS. Se publican solo las afirmaciones del token (quién, qué
      # rama, para quién), nunca el token: sin firma no sirve para nada y caduca en minutos.
      - name: Identidad OIDC que recibe AWS
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          carga = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(carga + "=" * (-len(carga) % 4)))
          ver = {k: claims.get(k) for k in ("iss", "aud", "sub", "ref", "ref_type", "event_name", "repository",
                                             "repository_id", "repository_owner_id", "job_workflow_ref", "environment")}
          print("::notice title=OIDC::" + json.dumps(ver, ensure_ascii=False))
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::369017477131:role/education-originales-github
          aws-region: eu-south-2
          role-session-name: prueba-almacen-${{ github.run_id }}
      - name: Subir, leer y comprobar que no se sobrescribe
        run: python -m motor.almacen prueba
      - name: Limpiar la copia local
        if: always()
        run: rm -rf codigo
