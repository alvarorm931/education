# Lista oficial de boletines autonómicos y provinciales.
# Fuente: https://www.boe.es/legislacion/otros_diarios_oficiales.php (consultada el 29/10/2026 desde GitHub Actions).
# 19 autonómicos (17 comunidades + Ceuta y Melilla) y 43 provinciales (incluidos Álava, Bizkaia y Gipuzkoa).
# Sondeo del 29/10/2026 desde GitHub Actions (servidores fuera de España): acceso y canales estructurados encontrados en la portada.
# estado: sin_conector | sondeado | conector_en_pruebas | conector_activo

