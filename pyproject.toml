[project]
name = "motor"
version = "0.1.0"
description = "Motor de captura y extracción de datos públicos para el portal de estudios y oposiciones"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "openpyxl>=3.1",
    "pypdf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
estudios = ["duckdb>=1.1"]
# Almacén privado de originales en S3 (escritura condicional If-None-Match: botocore 1.35 o posterior)
almacen = ["boto3>=1.35"]
# Control y vigilancia SEO (motor/seo)
seo = ["lxml>=5", "numpy>=1.26", "playwright>=1.45", "google-auth>=2.20"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
